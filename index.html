<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Language Demo Translator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #111827, #020617);
      color: white;
      overflow: hidden;
    }

    video {
      display: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    .panel {
      position: fixed;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      width: min(90%, 620px);
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: 0 0 35px rgba(34, 211, 238, 0.18);
      z-index: 10;
    }

    .label {
      font-size: 14px;
      letter-spacing: 2px;
      color: #67e8f9;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    #translation {
      font-size: clamp(34px, 8vw, 70px);
      font-weight: 800;
      color: #f9a8d4;
      text-shadow: 0 0 22px rgba(244, 114, 182, 0.8);
      margin-bottom: 10px;
    }

    #hint {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.6;
    }

    .top {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 18px;
      padding: 16px;
      max-width: 340px;
      backdrop-filter: blur(12px);
    }

    .top h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #67e8f9;
    }

    .top p {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div class="top">
    <h1>Sign Language Demo</h1>
    <p>
      Allow camera. Cuba tunjuk open palm, fist, peace sign, thumbs up, atau I love you sign.
    </p>
  </div>

  <div class="panel">
    <div class="label">Translation</div>
    <div id="translation">Loading...</div>
    <div id="hint">Show your hand clearly to the camera.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const translation = document.getElementById("translation");
    const hint = document.getElementById("hint");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function fingerIsUp(landmarks, tip, pip) {
      return landmarks[tip].y < landmarks[pip].y;
    }

    function thumbIsUp(landmarks) {
      const wrist = landmarks[0];
      const thumbTip = landmarks[4];
      const thumbIp = landmarks[3];
      const indexMcp = landmarks[5];

      const thumbAway = distance(thumbTip, indexMcp) > distance(thumbIp, indexMcp);
      const thumbHigher = thumbTip.y < wrist.y;

      return thumbAway && thumbHigher;
    }

    function detectGesture(landmarks) {
      const thumb = thumbIsUp(landmarks);
      const index = fingerIsUp(landmarks, 8, 6);
      const middle = fingerIsUp(landmarks, 12, 10);
      const ring = fingerIsUp(landmarks, 16, 14);
      const pinky = fingerIsUp(landmarks, 20, 18);

      const upCount = [thumb, index, middle, ring, pinky].filter(Boolean).length;

      if (thumb && index && pinky && !middle && !ring) {
        return {
          text: "I Love You",
          hint: "Detected: thumb + index + pinky up"
        };
      }

      if (!thumb && index && middle && !ring && !pinky) {
        return {
          text: "Peace",
          hint: "Detected: index + middle up"
        };
      }

      if (thumb && !index && !middle && !ring && !pinky) {
        return {
          text: "Good",
          hint: "Detected: thumbs up"
        };
      }

      if (!thumb && !index && !middle && !ring && !pinky) {
        return {
          text: "Stop / Fist",
          hint: "Detected: closed hand"
        };
      }

      if (upCount >= 4) {
        return {
          text: "Hello",
          hint: "Detected: open palm"
        };
      }

      if (index && !middle && !ring && !pinky) {
        return {
          text: "One / Pointing",
          hint: "Detected: index finger up"
        };
      }

      return {
        text: "Unknown Sign",
        hint: "Try open palm, fist, peace, thumbs up, or I love you."
      };
    }

    function drawHand(landmarks) {
      const connections = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
      ];

      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(34, 211, 238, 0.9)";
      ctx.shadowBlur = 18;
      ctx.shadowColor = "#22d3ee";

      connections.forEach(([a, b]) => {
        ctx.beginPath();
        ctx.moveTo(landmarks[a].x * canvas.width, landmarks[a].y * canvas.height);
        ctx.lineTo(landmarks[b].x * canvas.width, landmarks[b].y * canvas.height);
        ctx.stroke();
      });

      landmarks.forEach((point, index) => {
        ctx.beginPath();
        ctx.arc(point.x * canvas.width, point.y * canvas.height, index === 0 ? 8 : 6, 0, Math.PI * 2);
        ctx.fillStyle = index === 0 ? "#f472b6" : "#67e8f9";
        ctx.fill();
      });
    }

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 80,
        canvas.width / 2, canvas.height / 2, canvas.width
      );
      gradient.addColorStop(0, "#111827");
      gradient.addColorStop(1, "#020617");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        drawHand(landmarks);

        const result = detectGesture(landmarks);
        translation.textContent = result.text;
        hint.textContent = result.hint;
      } else {
        translation.textContent = "No Hand";
        hint.textContent = "Show your hand clearly in front of the camera.";
      }
    });

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 640,
      height: 480
    });

    camera.start().catch(() => {
      translation.textContent = "Camera Blocked";
      hint.textContent = "Allow camera permission in your browser settings.";
    });
  </script>
</body>
</html>
