<!DOCTYPE html>
<html>
<head>
  <title>Hand Particle Art</title>
  <style>
    body { margin:0; overflow:hidden; background:#020617; }
    video { display:none; }
    canvas { position:fixed; inset:0; }
    #text {
      position:fixed; top:20px; left:20px;
      color:#67e8f9; font-family:monospace;
      z-index:10;
    }
  </style>
</head>
<body>
  <div id="text">Show your hand to the camera ✨</div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = innerWidth;
    canvas.height = innerHeight;

    let handPoints = [];
    let particles = [];

    for (let i = 0; i < 500; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: 0,
        vy: 0,
        size: Math.random() * 3 + 1
      });
    }

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
      handPoints = [];

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        landmarks.forEach(point => {
          handPoints.push({
            x: point.x * canvas.width,
            y: point.y * canvas.height
          });
        });
      }
    });

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 640,
      height: 480
    });

    camera.start();

    function animate() {
      ctx.fillStyle = "rgba(2, 6, 23, 0.18)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        let target = null;
        let minDist = 9999;

        handPoints.forEach(h => {
          const d = Math.hypot(p.x - h.x, p.y - h.y);
          if (d < minDist) {
            minDist = d;
            target = h;
          }
        });

        if (target && minDist < 260) {
          p.vx += (target.x - p.x) * 0.002;
          p.vy += (target.y - p.y) * 0.002;
        } else {
          p.vx += (Math.random() - 0.5) * 0.08;
          p.vy += (Math.random() - 0.5) * 0.08;
        }

        p.vx *= 0.94;
        p.vy *= 0.94;

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = "#22d3ee";
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#22d3ee";
        ctx.fill();
      });

      handPoints.forEach(h => {
        ctx.beginPath();
        ctx.arc(h.x, h.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#f472b6";
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#f472b6";
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }

    animate();

    addEventListener("resize", () => {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    });
  </script>
</body>
</html>
